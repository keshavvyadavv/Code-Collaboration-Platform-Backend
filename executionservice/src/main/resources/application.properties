spring.application.name=executionservice
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/executiondb
spring.datasource.username=root
spring.datasource.password=keshav
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60
spring.task.execution.thread-name-prefix=execution-worker-

logging.level.com.executionservice=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN